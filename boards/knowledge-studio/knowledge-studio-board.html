<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Open+Sans:wght@400;600&amp;display=swap">
<style>
:root{--bg:#FAFAF7;--surface:#FFFFFF;--ink:#2A2E2C;--body:#4A4F4D;--line:#E2E4E1;--teal:#2F6F7E;--green:#2F6B3F;--tint:#EDF5F8;--warn:#FDF1DC;--amber:#F5A623;--sky:#7FAFC6;--off:#86918B;
--head:Poppins,system-ui,sans-serif;--text:'Open Sans',Roboto,system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--body);font-family:var(--text);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(47,107,63,.35);outline-offset:2px}
h1,h2,h3{font-family:var(--head);color:var(--ink);margin:0}
.app{display:flex;flex-direction:column;height:100vh;min-height:620px}
header.top{background:var(--teal);color:#fff;padding:6px 14px;display:flex;flex-wrap:nowrap;align-items:center;gap:12px}
header.top h1{color:#fff;font-size:15px;font-weight:700;white-space:nowrap;flex:none}
.search{flex:0 1 300px;min-width:160px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:0 10px}
.search input{border:0;outline:0;width:100%;min-height:30px;font-size:13.5px;background:transparent;color:var(--ink)}
.chips{display:flex;flex-wrap:nowrap;gap:6px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:thin;padding:2px 0}
.chip{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:2px 10px;font-family:var(--head);font-size:12.5px;font-weight:500;min-height:28px;white-space:nowrap;flex:none}
.chip b{font-weight:700}
.chip[aria-pressed="true"]{background:#fff;color:var(--ink)}
.asof{font-size:11.5px;opacity:.85;white-space:nowrap;flex:none}
.body{flex:1;display:flex;min-height:0}
nav.rail{width:216px;flex-shrink:0;border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:12px 8px}
.rail h4{margin:14px 10px 6px;font-family:var(--head);font-size:11px;letter-spacing:.06em;color:var(--teal);font-weight:600}
.rail button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 10px;min-height:34px;font-size:13.5px;color:var(--ink)}
.rail button:hover{background:var(--bg)}
.rail button[aria-current="true"]{background:var(--tint);font-weight:600}
.rail .n{font-size:12px;color:var(--body);font-weight:600}
.rail .cat{padding-left:18px;font-size:13px}
.rail .grp{font-weight:600}
.rail .few .n{color:var(--ink)}
main.main{flex:1;min-width:0;overflow:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:14px}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.mhead h2{font-size:22px;font-weight:600}
.mhead .count{font-size:13.5px}
.linkbtn{border:0;background:transparent;color:var(--green);font-weight:600;padding:0;text-decoration:underline;min-height:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:13.5px}
thead th{position:sticky;top:0;background:var(--tint);text-align:left;font-family:var(--head);font-weight:600;color:var(--ink);padding:9px 12px;font-size:12.5px;z-index:1}
tbody td{border-top:1px solid var(--line);padding:9px 12px;vertical-align:top}
tbody tr.sel{background:#F3F8F5;box-shadow:inset 3px 0 0 var(--green)}
.art{border:0;background:transparent;padding:0;text-align:left;font-weight:600;color:var(--ink);min-height:24px}
.art:hover{text-decoration:underline}
.sub{display:block;font-size:12px;color:var(--body);font-weight:400}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--line);display:inline-block}
.dots i.d{background:var(--green)}.dots i.c{background:var(--sky)}.dots i.b{background:var(--amber)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap;border:1px solid transparent}
.p-write{background:var(--bg);color:var(--body);border-color:var(--line)}
.p-review,.p-publish{background:var(--tint);color:var(--teal)}
.p-syncBlocked,.p-notLinked{background:var(--warn);color:var(--ink);border-color:var(--amber)}
.p-penny{background:#fff;color:var(--green);border-color:var(--green)}
.p-ready{background:var(--green);color:#fff}
.p-open{background:var(--warn);color:var(--ink);border-color:var(--amber)}
.p-done{background:#fff;color:var(--green);border-color:var(--green)}
.p-none{background:#fff;color:var(--ink);border:1px dashed var(--ink)}
.p-thin{background:var(--warn);color:var(--ink);border-color:var(--amber)}
.list{display:flex;flex-direction:column}
.list button.item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 14px;min-height:44px;width:100%}
.list button.item:first-child{border-top:0}
.list button.item[aria-current="true"]{background:#F3F8F5;box-shadow:inset 3px 0 0 var(--green)}
.list .k{font-size:12px;font-weight:600;color:var(--teal);display:block}
.list .t{font-weight:600;color:var(--ink);display:block}
aside.panel.focus{position:fixed;inset:0;width:auto!important;max-width:none;z-index:40;border:0;box-shadow:none;background:var(--bg)}
aside.panel.focus{overflow:hidden}
.panel.focus>.fside{flex:none}
@media (max-width:899px){aside.panel.focus{overflow-y:auto}.panel.focus>.pb{overflow:visible;flex:none}}
.panel.focus>.ph,.panel.focus>.tabs{width:100%;max-width:900px;margin-left:auto;margin-right:auto;flex:none}
.panel.focus>.pb{flex:1 1 auto;min-height:0;overflow:auto;padding:14px max(18px,calc((100% - 864px)/2)) 0}
.panel.focus .stagebar{display:none}.panel.focus>.ph{padding-top:12px}
.panel.focus>.ph{border-bottom:0}.panel.focus>.tabs{border-bottom:1px solid var(--line)}
.panel.focus .tool{position:sticky;top:0;z-index:3}
.panel.focus .rte{min-height:62vh;max-height:none;font-size:15.5px;line-height:1.7;padding:18px 22px}
.panel.focus .savebar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--line);z-index:3}
aside.panel{position:relative;width:600px;max-width:100%;flex-shrink:0;border-left:1px solid var(--line);background:var(--surface);overflow:auto;box-shadow:-8px 0 24px rgba(42,46,44,.08);display:flex;flex-direction:column}
.ph{padding:16px 18px 10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.ph .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph .kick{font-size:12px;font-weight:600;color:var(--teal)}
.ph h3{font-size:18px;line-height:1.3}
.x{border:0;background:transparent;font-size:22px;line-height:1;min-width:36px;min-height:36px;border-radius:8px;color:var(--ink)}
.x:hover{background:var(--bg)}
.stagebar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.stagebar span{font-size:11.5px;border-top:4px solid var(--line);padding-top:4px}
.stagebar .d{border-color:var(--green)}.stagebar .c{border-color:var(--sky);font-weight:600;color:var(--ink)}.stagebar .b{border-color:var(--amber);font-weight:600;color:var(--ink)}
.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 10px;min-height:38px;font-family:var(--head);font-weight:500;font-size:13.5px;color:var(--body);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green);font-weight:600}
.pb{padding:14px 18px 24px;display:flex;flex-direction:column;gap:12px}
.pb>p{margin:0}
.issue{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.issue.block{border-color:var(--amber);background:var(--warn)}
.issue.info{background:var(--bg)}
.issue .meta{font-size:11.5px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.04em}
.issue.done{opacity:.55}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink)}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;background:#fff;font-weight:400;font-size:14px}
textarea{min-height:76px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:400;font-size:13.5px}
.checks label{display:flex;gap:6px;align-items:center;min-height:30px}
.btn{border:0;border-radius:8px;min-height:38px;padding:0 14px;font-family:var(--head);font-weight:600;font-size:13.5px}
.btn.solid{background:var(--green);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{background:var(--off);color:#fff;border-color:var(--off);cursor:not-allowed}
.btn.ghost:disabled{background:#fff;color:var(--off)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:12.5px;color:var(--body)}
.ok{font-size:13px;color:var(--green);font-weight:600}
.err{font-size:13px;color:#8A3B12;font-weight:600}
.box{border-radius:12px;padding:12px 14px;background:var(--bg);font-size:13.5px}
.box.warn{background:var(--warn)}
blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--teal);background:var(--tint);border-radius:0 10px 10px 0;color:var(--ink)}
.ins{display:flex;flex-direction:column;gap:6px;padding:12px 14px}
.ins h3{font-size:14px}
.ins ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ins li{display:flex;gap:8px;font-size:13.5px}
.ins .tag{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--tint);color:var(--teal);white-space:nowrap;height:fit-content}
.ins .crit .tag{background:var(--warn);color:var(--ink)}
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.seg button{border:0;border-radius:8px;min-height:32px;padding:0 10px;background:transparent;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset button{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:32px;padding:0 12px;font-size:13px}
.chipset button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.preview{font-size:13px;display:flex;flex-direction:column;gap:3px}
.waiting{margin:40px auto;max-width:520px;text-align:center;padding:28px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:9;max-width:90vw}
.toast.bad{background:#8A3B12}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.more{align-self:flex-start}
.grip{position:absolute;left:0;top:0;bottom:0;width:10px;cursor:col-resize;z-index:2;background:transparent;border:0;padding:0}
.grip:hover,.grip:focus-visible{background:rgba(47,107,63,.18)}
.body.wide main.main{display:none}
.body.wide aside.panel{flex:1;width:auto!important;box-shadow:none}
.phbtns{display:flex;gap:4px;align-items:flex-start}
.tool{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--bg)}
.tool button{border:1px solid var(--line);background:#fff;border-radius:6px;min-height:32px;min-width:34px;padding:0 8px;font-size:13px;font-weight:600}
.rte{border:1px solid var(--line);border-radius:0 0 8px 8px;min-height:240px;max-height:60vh;overflow:auto;padding:10px 12px;background:#fff;color:var(--ink);font-size:14px;line-height:1.55}
.rte:focus{outline:3px solid rgba(47,107,63,.25)}
.rte h3{font-size:16px;margin:12px 0 6px}.rte p{margin:0 0 8px}.rte ul,.rte ol{margin:0 0 8px;padding-left:22px}
.linkrow{display:flex;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-top:0;background:var(--bg)}
.linkrow input{flex:1}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.step .stephead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--head);font-weight:600;color:var(--ink);font-size:13.5px}
.ib{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:34px;min-height:32px;font-size:13px}
.ib:disabled{opacity:.4;cursor:not-allowed}
.sec{font-family:var(--head);font-weight:600;color:var(--ink);font-size:14px;margin-top:4px}
.wf{display:flex;flex-direction:column;gap:8px}
h3.sec{font-size:14px}
.wf-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0 0}
.wf-facts>div{min-width:0;padding:6px 8px;background:var(--bg);border-radius:8px}
.wf-facts dt{font-size:10.5px;color:var(--body);font-weight:600;line-height:1.3}
.wf-facts dd{margin:2px 0 0}
.wflink{border:0;background:transparent;padding:0;font:inherit;font-size:12px;font-weight:650;color:var(--ink);text-align:left;cursor:pointer;line-height:1.35;overflow-wrap:anywhere}
.wflink:hover{text-decoration:underline}
.wflink.p-done{color:#2F6B3F}.wflink.p-open{color:#8A3B12}.wflink.p-none{color:var(--body)}
.workflow-sub{display:block;font-size:11.5px;color:var(--body);margin-top:2px;line-height:1.35}
.apnote{margin:6px 0 0;font-size:12.5px}
.wfd{font-size:12.5px}.wfd summary{cursor:pointer;color:var(--ink);font-weight:600;padding:4px 0}
.wf-error{overflow-wrap:anywhere;white-space:pre-wrap;background:var(--warn);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink)}
@media(max-width:640px){.wf-facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel.focus .fside .wf-facts{grid-template-columns:1fr 1fr}
.vbadge{display:inline-flex;align-items:center;min-height:20px;margin:2px 0 0 7px;padding:1px 7px;border:1px solid #cbd9d1;border-radius:999px;background:#edf4ef;color:#284a39;font-size:11px;font-weight:650;line-height:1.2;vertical-align:middle}
.vbadge.pub{border-color:#d5d2bd;background:#f5f3e9;color:#5c5430}
.vtools{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:2px 0 4px}.vtools .vbadge{margin:0 4px 0 0}
@media (min-width:900px){
 aside.panel.focus{display:grid;grid-template-columns:minmax(260px,300px) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 .panel.focus>.fside{grid-column:1;grid-row:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
 .panel.focus .fside>.ph{max-width:none;margin:0;padding:16px 16px 10px;border-bottom:0;flex:none}
 .panel.focus .fside>.ph h3{font-size:15px}
 .panel.focus .fside>.ph .note{font-size:12.5px}
 .panel.focus .fside>.ph .apbar{flex-direction:column;align-items:stretch}
 .panel.focus .fside>.ph .apbar .btn{width:100%}
 .panel.focus .fside>.ph .vtools{flex-direction:column;align-items:flex-start}
 .panel.focus .fside>.tabs{max-width:none;margin:0;flex-direction:column;align-items:stretch;gap:2px;padding:6px 10px 24px;border-bottom:0;flex:none}
 .panel.focus .fside>.tabs button{text-align:left;border-bottom:0;border-left:3px solid transparent;border-radius:0 6px 6px 0;padding:8px 12px}
 .panel.focus .fside>.tabs button[aria-selected="true"]{border-left-color:var(--green);background:var(--tint)}
 .panel.focus>.pb{grid-column:2;grid-row:1;min-height:0;padding:28px max(28px,calc((100% - 820px)/2)) 0;overflow-y:auto;overscroll-behavior:contain}
 .panel.focus .rte{min-height:calc(100vh - 300px)}
}
.ftitle{font-family:var(--head);font-size:26px;line-height:1.25;color:var(--ink);margin:0 0 2px}
.panel.focus .pb>.note:first-of-type{font-size:12.5px}
.apbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.anbox{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.chg{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line)}
.sec.sm{font-size:13px;margin-top:6px}
.cmp{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}.cmp th:first-child{width:110px}.cmp td{overflow-wrap:anywhere}.cmp th{text-align:left;font-weight:600;color:var(--body);padding:4px 6px;border-bottom:1px solid var(--line)}
.cmp td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.o{color:#8A3B12;text-decoration:line-through;text-decoration-color:rgba(138,59,18,.5)}.n{color:var(--ink);font-weight:600}
.dlist{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.dadd{background:#E5F4E4;border-left:3px solid #3E9A55;padding:5px 8px;border-radius:0 6px 6px 0;color:var(--ink)}
.ddel{background:#FBEBEB;border-left:3px solid #C2462B;padding:5px 8px;border-radius:0 6px 6px 0;color:#6B2A1A;text-decoration:line-through;text-decoration-color:rgba(107,42,26,.45)}
.dsame{font-size:12px;color:var(--body);padding:2px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.autock{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:4px 0}.autock .ok,.autock .err{font-weight:700;width:14px;flex:none;margin:0}
.sfc{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line)}
.sfh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.vtrack{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin:2px 0 4px}
.vtrack i{display:inline-block;width:14px;height:2px;background:var(--line)}
.vdot{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--body);border:1px solid var(--line)}
.vdot.live{background:var(--green);border-color:var(--green);color:#fff}
.vdot.draft{background:#fff;border:1.5px dashed var(--amber);color:var(--ink)}
.vmore{font-size:12px;color:var(--body);padding:0 4px}
.ov{display:flex;flex-direction:column;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.tile:hover{border-color:var(--teal)}
.tile .tl{font-size:12.5px;color:var(--body);font-weight:600}
.tile .tv{font-family:var(--head);font-size:26px;font-weight:600;color:var(--ink);line-height:1.15}
.tile .tv small{font-size:15px;color:var(--body);font-weight:500}
.tile .ts{font-size:12.5px;color:var(--body)}
.tile.bad{border-left:4px solid #C2462B}.tile.warn{border-left:4px solid var(--amber)}
.ovc{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ovc>p{margin:0}
.ovh{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}.ovh h3{font-size:15px;margin:0}
.hbar{display:flex;gap:2px;height:12px;width:100%;min-width:60px}
.hbar.big{height:22px}
.hbar>button{border:0;padding:0;min-width:4px;border-radius:0;cursor:pointer}
.hbar>button:first-child{border-radius:4px 0 0 4px}.hbar>button:last-child{border-radius:0 4px 4px 0}.hbar>button:only-child{border-radius:4px}
.hbar>button.seg-light{box-shadow:inset 0 0 0 1px #C9C6BE}
.hbar>button:hover,.hbar>button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.hbar.empty{font-size:12px;color:var(--body);height:auto}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--body)}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg b{color:var(--ink)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px}.leg i.dot{border-radius:50%}

<body>
<div class="app">

</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
"use strict";
var BOARD="knowledge-studio",BOARD_VERSION=1,CONTRACT=1;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
var D=null,pending={},seq=0,busy={};
function send(m){parent.postMessage(m,"*")}
function act(name,payload,key){
  var id="a"+(++seq);busy[key||id]=true;render();
  return new Promise(function(res){
    var t=null;function arm(){clearTimeout(t);t=setTimeout(function(){delete pending[id];delete busy[key||id];toast("Trail OS didn't answer in time. Check the record before trying again.",true);render();res({ok:false,code:"timeout"})},20000)}

window.addEventListener("message",function(e){
  if(e.source!==parent)return;var m=e.data;if(!m||typeof m!=="object")return;
  if(m.type==="data"&&m.data){if(m.data.contractVersion!==CONTRACT){showWait("This board version expects data contract "+CONTRACT+". Ask an admin to activate a matching board version.");return}D=index(m.data);followRevision();if(V.pendingOpen&&D.by[V.pendingOpen]){V.sel={kind:"article",id:V.pendingOpen};V.tab="edit";V.pendingOpen=null}render()}
  else if(m.type==="actionPending"&&pending[m.id]&&pending[m.id].keepAlive){pending[m.id].keepAlive()}
  else if(m.type==="result"&&pending[m.id]){var r=pending[m.id];delete pending[m.id];r(m)}
});
send({type:"ready",board:BOARD,boardVersion:BOARD_VERSION,contractVersion:CONTRACT});
setTimeout(function(){if(!D)showWait("Trail OS hasn't sent Knowledge data yet. Reload the page; if this stays, tell an admin.")},6000);
function showWait(msg){$("waitmsg").textContent=msg;$("waiting").hidden=false;$("body").hidden=true}
var tt=null;function toast(msg,bad){var t=$("toast");t.textContent=msg;t.className="toast"+(bad?" bad":"");t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},4500)}

/* ---------- data ---------- */
var STAGES=["Write","Review","Publish","Penny"];
var STEP={write:{i:0,l:"Draft"},review:{i:1,l:"In review"},syncBlocked:{i:2,l:"Field fix needed"},notLinked:{i:2,l:"Live, not linked"},publish:{i:2,l:"Ready to publish"},penny:{i:3,l:"Penny check"},ready:{i:4,l:"Ready for Penny"}};
var FIELDS=[{k:"appliesTo",l:"Applies To",kind:"multi"},{k:"audience",l:"Audience",kind:"select",list:"audiences"},{k:"difficulty",l:"Difficulty",kind:"select",list:"difficulties"},{k:"reviewCycle",l:"Review cycle",kind:"select",list:"reviewCycles"},{k:"department",l:"Owner department",kind:"select",list:"departments"},{k:"estimatedMinutes",l:"Estimated time",kind:"number"},{k:"category",l:"Data category",kind:"category"}];
var PFIELDS=[{k:"reviewer",l:"Business reviewer",kind:"person"},{k:"validator",l:"Penny validator",kind:"person"}];
function fieldDef(k){var all=FIELDS.concat(PFIELDS);for(var i=0;i<all.length;i++)if(all[i].k===k)return all[i];return FIELDS[0]}
function bulkFields(){return canAssign()?FIELDS.concat(PFIELDS):FIELDS}
function index(d){
  d.lists=d.lists||{};["types","audiences","appliesTo","departments","difficulties","reviewCycles"].forEach(function(k){d.lists[k]=d.lists[k]||[]});

  d.viewer=d.viewer||{};d.people=d.people||[];d.personBy={};d.people.forEach(function(p){d.personBy[String(p.email||"").toLowerCase()]=p});
  d.by={};d.articles.forEach(function(a){d.by[a.id]=a;a.issues=a.issues||[];a.appliesTo=a.appliesTo||[];a.st=STEP[a.step]||STEP.write;var as=a.assignment||{};a.reviewer=String((as.reviewer&&as.reviewer.email)||"").toLowerCase();a.validator=String((as.validator&&as.validator.email)||"").toLowerCase();if(as.reviewer&&as.reviewer.name&&!d.personBy[a.reviewer])d.personBy[a.reviewer]=as.reviewer;if(as.validator&&as.validator.name&&!d.personBy[a.validator])d.personBy[a.validator]=as.validator;a.live=a.issues.filter(function(x){return x.severity!=="info"&&!x.resolved})});

  d.paths=d.categories.map(function(c){return c.path});

}
/* knowledge-studio-version-adapter */
/* Version families are built into this board; the marker above tells Trail OS to skip its server-side adapter. */
function groupVersions(d){
  var gs=Array.isArray(d.articleGroups)?d.articleGroups:[],covered={};
  d.allArticles=d.articles;d.groupOf={};d.repOf={};d.pubGroups=0;
  gs.forEach(function(g){
    if(!g||!Array.isArray(g.articleIds))return;
    var ids=g.articleIds.filter(function(id){return d.by[id]&&!covered[id]});if(!ids.length)return;
    var x={id:g.id,articleIds:ids,draftArticleId:d.by[g.draftArticleId]&&ids.indexOf(g.draftArticleId)>=0?g.draftArticleId:null,publishedArticleId:d.by[g.publishedArticleId]&&ids.indexOf(g.publishedArticleId)>=0?g.publishedArticleId:null};
    x.rep=x.draftArticleId||(ids.indexOf(g.defaultArticleId)>=0?g.defaultArticleId:ids[0]);
    if(x.publishedArticleId)d.pubGroups++;
    ids.forEach(function(id){covered[id]=true;d.groupOf[id]=x;d.repOf[id]=x.rep});
  });
  d.articles.forEach(function(a){if(!covered[a.id]){d.groupOf[a.id]={id:a.id,articleIds:[a.id],draftArticleId:null,publishedArticleId:null,rep:a.id};d.repOf[a.id]=a.id;if(a.st.i>=3)d.pubGroups++}});
  d.articles=d.allArticles.filter(function(a){return d.repOf[a.id]===a.id});
}
function grp(a){return a&&D.groupOf?D.groupOf[a.id]:null}
function hasDraftRevision(a){var g=grp(a);return !!(g&&g.draftArticleId&&g.publishedArticleId===a.id&&g.draftArticleId!==a.id)}
function versionMark(a){var g=grp(a);if(!g)return "";
  if(g.publishedArticleId===a.id)return '<span class="vbadge pub">Published</span>';
  if(g.draftArticleId===a.id)return '<span class="vbadge">'+(g.articleIds.length>1?"Draft revision":"Draft")+"</span>";return ""}
function versionTools(a){var g=grp(a);if(!g||g.articleIds.length<2)return "";
  var h='<div class="vtools" aria-label="Article versions">'+versionMark(a);
  if(g.publishedArticleId&&g.publishedArticleId!==a.id)h+='<button type="button" class="btn ghost sm" data-vopen="'+esc(g.publishedArticleId)+'">View published version</button>';
  if(g.draftArticleId&&g.draftArticleId!==a.id)h+='<button type="button" class="btn ghost sm" data-vopen="'+esc(g.draftArticleId)+'">View draft revision</button>';
  return h+"</div>"}
function followRevision(){
  if(!V.sel||V.sel.kind!=="article")return;
  if(!D.by[V.sel.id]){if(V.pin===V.sel.id)V.pin=null;return}
  if(V.pin===V.sel.id)return;
  var a=D.by[V.sel.id];if(hasDraftRevision(a)){var nid=grp(a).draftArticleId;if(V.content[a.id]&&!V.content[nid])delete V.content[a.id];V.sel.id=nid}
  var keep={};Object.keys(V.picked||{}).forEach(function(id){var r=D.repOf[id]||id;if(V.picked[id]&&D.by[r]&&canEdit(D.by[r]))keep[r]=true});V.picked=keep;
}
var V={view:"overview",pin:null,insOpen:false,qaud:null,cat:null,q:"",sel:null,tab:null,back:null,picked:{},limit:200,
  bulk:{field:"appliesTo",mode:"add",vals:{},value:"",onlyBlank:true,skip:false},forms:{},checks:{},done:{},content:{},pw:null,wide:false,linkFor:null,range:null,mrole:"all"};
function canEdit(a){if(a&&hasDraftRevision(a))return false;return a&&a.perms?!!a.perms.edit:!!(D.viewer.isStaff||D.viewer.isManager)}
function canPublish(a){return a&&a.perms?!!a.perms.publishHandoff:!!D.viewer.canPublish}
function canValidate(a){if(a&&a.perms&&a.perms.validate!=null)return !!a.perms.validate;return !ownArticle(a)&&(!!D.viewer.isStaff||isMe(a.validator))}
function typeLabel(k){return (D.typeBy[k]&&D.typeBy[k].label)||"Unknown type"}
function shortCat(p){if(!p)return "\u2014";var s=p.split(" \u203a ");return s.length>2?s[1]+" \u203a "+s[s.length-1]:(s[1]||s[0])}
function fmtDate(iso){if(!iso)return "";var d=new Date(iso.length===10?iso+"T12:00:00Z":iso);return d.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"America/Chicago"})}
function fmtWhen(iso){if(!iso)return "";return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZone:"America/Chicago"})+" CT"}
function blank(a,k){var v=a[k];return v==null||v===""||(Array.isArray(v)&&!v.length)}
function dueSoon(a){if(!a.reviewDue)return false;var t=Date.parse(a.reviewDue+"T12:00:00Z"),now=Date.parse(D.asOf||new Date().toISOString());return t-now<=30*864e5}
function matchQ(a){if(!V.q)return true;var q=V.q.toLowerCase();return (a.title+" "+(a.summary||"")+" "+(a.category||"")).toLowerCase().indexOf(q)>=0}
function inCat(a){return !V.cat||(a.category&&(a.category===V.cat||a.category.indexOf(V.cat+" \u203a ")===0))}
function myRoles(a){var r=[];if(isMe(a.author)||isMe(a.claimedBy))r.push("author");if(isMe(a.reviewer))r.push("business");if(isMe(a.validator))r.push("penny");return r}
var ROLE_L={author:"Author",business:"Business reviewer",penny:"Penny validator"};
function returnedToMe(a){var b=rstate(a,"business"),t=rstate(a,"technical");return myRoles(a).indexOf("author")>=0&&((b.status&&b.status!=="passed"&&b.current!==false)||(t.status&&t.status!=="passed"&&t.current!==false))}
var VIEWS={all:function(){return true},approve:function(a){return awaitingApproval(a)},unsent:function(a){return !!DRAFT_ST[a.status]},ready:function(a){return pennyReady(a)},mine:function(a){return myRoles(a).length>0},fix:function(a){return a.live.length>0},review:function(a){return a.st.i<2},
  publish:function(a){return a.st.i===2},penny:function(a){return a.step==="penny"},due:dueSoon,
  myrev:function(a){return isMe(a.reviewer)&&a.step==="review"},
  mytech:function(a){return isMe(a.validator)&&a.step==="penny"},
  needrev:function(a){return a.step==="review"&&!a.reviewer},
  needtech:function(a){return a.step==="penny"&&!a.validator}};
function viewRows(view){
  var f=viewFn(view);
  var mr=view==="mine"&&V.mrole&&V.mrole!=="all"?V.mrole:null;
  return D.articles.filter(function(a){return f(a)&&inCat(a)&&matchQ(a)&&(!mr||myRoles(a).indexOf(mr)>=0)});
}
function viewFn(v){var f=VIEWS[v];if(f)return f;if(v.indexOf("miss:")===0){var k=v.slice(5);return function(a){return a.linked&&blank(a,k)}}if(v.indexOf("iss:")===0){var ik=v.slice(4);return function(a){return a.live.some(function(x){return x.kind===ik})}}return function(){return false}}
function countView(v){return D.articles.filter(viewFn(v)).length}
function qStatus(q){var arts=(q.articleIds||[]).map(function(id){return D.by[id]}).filter(Boolean);if(!arts.length)return ["No article","p-none"];if(arts.some(function(a){return a.st.i>=4}))return ["Ready","p-done"];return ["Not ready","p-open"]}
function pageArticles(p){if(!p.category)return [];return (D.allArticles||D.articles).filter(function(a){var g=grp(a);return !g||(g.publishedArticleId?g.publishedArticleId===a.id:g.rep===a.id)}).filter(function(a){return a.st.i>=3&&a.category&&(a.category===p.category||a.category.indexOf(p.category+" \u203a ")===0)})}
function pStatus(p){if(!p.category)return ["Needs a category","p-none"];var n=pageArticles(p).length;if(!n)return ["No help","p-none"];if(n<5)return ["Thin","p-thin"];return ["Covered","p-done"]}
function decOpen(d){return d.status==="open"}

/* ---------- render ---------- */
function render(){
  if(!D)return;$("waiting").hidden=true;$("body").hidden=false;
  var aw=fmtWhen(D.asOf);$("asof").textContent="As of "+aw.replace(/^[A-Z][a-z]{2} \d{1,2}, /,"");$("asof").title="Data as of "+aw;
  renderChips();renderRail();renderMain();renderPanel();
}
function renderChips(){
  var pub=D.pubGroups!=null?D.pubGroups:D.articles.filter(function(a){return a.st.i>=3}).length,ready=D.articles.filter(pennyReady).length;
  var apn=D.articles.filter(function(a){return awaitingApproval(a)&&canBizReview(a)}).length,mine=countView("myrev")+countView("mytech");var c=(apn?[["approve","<b>"+apn+"</b> for you to approve"]]:[]).concat(mine?[[countView("myrev")?"myrev":"mytech","<b>"+mine+"</b> for you to review"]]:[]).concat([["penny","<b>"+ready+"/"+pub+"</b> ready for Penny"],["fix","<b>"+countView("fix")+"</b> to fix"],["publish","<b>"+countView("publish")+"</b> to publish"],["decisions","<b>"+D.decisions.filter(decOpen).length+"</b> decisions"]]);

}
function rb(view,label,n,extra){return '<button type="button" data-view="'+esc(view)+'" aria-current="'+(V.view===view&&!V.cat)+'"'+(extra||"")+'><span>'+esc(label)+'</span><span class="n">'+(n==null?"":n)+"</span></button>"}

  h+="<h4>APPROVALS</h4>"+rb("approve","Waiting for approval",countView("approve"))+rb("unsent","Drafts not sent",countView("unsent"));
  h+="<h4>MY WORK</h4>"+rb("mine","My articles",countView("mine"))+rb("myrev","My business reviews",countView("myrev"))+rb("mytech","My Penny validations",countView("mytech"));
  if(canAssign())h+="<h4>ASSIGN REVIEWERS</h4>"+rb("needrev","Needs a business reviewer",countView("needrev"))+rb("needtech","Needs a Penny validator",countView("needtech"));
  h+="<h4>COVERAGE</h4>"+rb("questions","Reader questions",D.questions.filter(function(q){return qStatus(q)[0]==="No article"}).length)+rb("pages","Trail OS pages",D.pages.filter(function(p){return pStatus(p)[0]!=="Covered"}).length);
  h+="<h4>KEEP CURRENT</h4>"+rb("due","Review due",countView("due"));
  h+="<h4>MISSING IN SALESFORCE</h4>"+FIELDS.filter(function(f){return f.k!=="category"}).map(function(f){return rb("miss:"+f.k,f.l,countView("miss:"+f.k))}).join("");
  var groups={};D.articles.forEach(function(a){if(!a.category)return;var s=a.category.split(" \u203a ");var g=s[0],c=s[1]?s[0]+" \u203a "+s[1]:null;groups[g]=groups[g]||{n:0,kids:{}};groups[g].n++;if(c)groups[g].kids[c]=(groups[g].kids[c]||0)+1});
  h+="<h4>DATA CATEGORIES</h4>"+Object.keys(groups).sort().map(function(g){
    var kids=groups[g].kids;return '<button type="button" class="grp" data-cat="'+esc(g)+'" aria-current="'+(V.cat===g)+'"><span>'+esc(g)+'</span><span class="n">'+groups[g].n+"</span></button>"+Object.keys(kids).sort().map(function(c){return '<button type="button" class="cat'+(kids[c]<5?" few":"")+'" data-cat="'+esc(c)+'" aria-current="'+(V.cat===c)+'"><span>'+esc(c.split(" \u203a ")[1])+'</span><span class="n">'+kids[c]+"</span></button>"}).join("")}).join("");
  $("rail").innerHTML=h;
}
function viewTitle(){
  if(V.cat)return V.cat.split(" \u203a ").slice(1).join(" \u203a ")||V.cat;
  var t={all:"All articles",fix:"Fix",review:"Write and review",publish:"Publish",penny:"Penny check",due:"Review due in 30 days",overview:"Knowledge health",approve:"Waiting for approval",unsent:"Drafts not sent for approval",ready:"Ready for Penny",mine:"My articles",myrev:"My business reviews",mytech:"My Penny validations",needrev:"Needs a business reviewer",needtech:"Needs a Penny validator",decisions:"Decisions",questions:"Reader questions",pages:"Trail OS pages"}[V.view];
  if(V.view==="questions"&&V.qaud)return "Reader questions: "+V.qaud;if(t)return t;if(V.view.indexOf("iss:")===0)return "Fix: "+issueLabel(V.view.slice(4));if(V.view.indexOf("miss:")===0)return "Missing "+fieldDef(V.view.slice(5)).l;return "Articles";

function renderMain(){

  else if(V.view==="decisions"){var open=D.decisions.filter(decOpen).length;h+='<span class="count">'+open+" open \u00b7 "+D.decisions.length+" total</span>";body=listDecisions()}

function doBizReview(disp){

  if(t.id==="addstep"){var c0=V.content[V.sel.id];captureAll(c0);c0.steps.push({id:null,instruction:"",verifyLine:"",isOptional:false});c0.dirty=true;renderPanel();return}
  if(t.dataset.smove){var c1=V.content[V.sel.id];captureAll(c1);var mv=t.dataset.smove.split(":"),i=+mv[0],j=i+(+mv[1]);var tmp=c1.steps[i];c1.steps[i]=c1.steps[j];c1.steps[j]=tmp;c1.dirty=true;renderPanel();return}
  if(t.dataset.sdel){var c2=V.content[V.sel.id];captureAll(c2);c2.steps.splice(+t.dataset.sdel,1);c2.dirty=true;renderPanel();return}
  if(t.dataset.sopt!==undefined){var c3=V.content[V.sel.id];c3.steps[+t.dataset.sopt].isOptional=t.checked;c3.dirty=true;return}
  if(t.id==="savecontent"){doSaveContent();return}

  if(t.dataset.dec){V.sel={kind:"decision",id:t.dataset.dec};V.back=null;render();return}
  if(t.dataset.qn){V.sel={kind:"question",id:t.dataset.qn};V.back=null;render();return}
  if(t.dataset.pg){V.sel={kind:"page",id:t.dataset.pg};V.back=null;render();return}
  if(t.dataset.tab){if(V.sel&&V.content[V.sel.id])captureAll(V.content[V.sel.id]);V.tab=t.dataset.tab;render();return}
  if(t.dataset.pick){V.picked[t.dataset.pick]=t.checked;V.done.bulk=null;render();return}
  if(t.id==="pickall"){var rows=viewRows(V.view).slice(0,V.limit);rows.forEach(function(a){if(canEdit(a))V.picked[a.id]=t.checked});V.done.bulk=null;render();return}
  if(t.id==="bclear"){V.picked={};V.done.bulk=null;render();return}
  if(t.dataset.bmode){V.bulk.mode=t.dataset.bmode;render();return}
  if(t.dataset.bval){V.bulk.vals[t.dataset.bval]=!V.bulk.vals[t.dataset.bval];render();return}
  if(t.id==="bblank"){V.bulk.onlyBlank=t.checked;render();return}
  if(t.id==="bskip"){V.bulk.skip=t.checked;render();return}
  if(t.dataset.ck!==undefined){var a0=V.sel&&D.by[V.sel.id];if(a0){V.checks[a0.id]=V.checks[a0.id]||{};V.checks[a0.id][t.dataset.ck]=t.checked}return}
  if(t.id==="copycat"){var a1=D.by[V.sel.id];try{navigator.clipboard.writeText(a1.category).then(function(){toast("Category path copied.")},function(){toast("Couldn't copy. Select the path and copy it.",true)})}catch(err){toast("Couldn't copy. Select the path and copy it.",true)}return}
  if(t.dataset.rec){var op={type:t.dataset.rec,id:t.dataset.id};if(t.dataset.ver)op.version=t.dataset.ver;act("openRecord",op);return}
  if(t.dataset.fix){doFix(t.dataset.fix);return}
  if(t.id==="savedraft"){doSave();return}
  if(t.dataset.sync){var sid=t.dataset.sync;act("retrySync",{articleId:sid},"sync:"+sid).then(function(r){if(r.ok)toast(r.message||"Retry requested. Check Sync for the delivery status.")});return}
  if(t.dataset.pubcheck){var pid=t.dataset.pubcheck;act("checkPublication",{articleId:pid},"pub:"+pid).then(function(r){if(r.ok)toast(r.message||"Salesforce status checked. Nothing was delivered or published.")});return}
  if(t.dataset.pc){doPenny(t.dataset.pc);return}
  if(t.dataset.br){doBizReview(t.dataset.br);return}
  if(t.dataset.tr){doTechReview(t.dataset.tr);return}
  if(t.dataset.asg){doAssign(t.dataset.asg);return}
  if(t.dataset.ff&&t.type==="checkbox"){formInput(t,false);return}
  if(t.id==="bapply"){doBulk();return}
  if(t.dataset.decide){doDecide(t.dataset.decide);return}
  if(t.dataset.start){var qid=t.dataset.start;act("startArticle",{questionId:qid},"start:"+qid).then(function(r){if(r.ok){toast("Draft article started.");if(r.data&&r.data.articleId)V.pendingOpen=r.data.articleId}});return}
  if(t.dataset.map){var pgid=t.dataset.map,val=$("pg-cat").value||null;act("mapPage",{pageId:pgid,category:val},"map:"+pgid).then(function(r){if(r.ok){delete V.forms["pg:"+pgid];toast("Mapping saved.")}});return}
});
document.addEventListener("input",function(e){
  var t=e.target;if(!D)return;
  if(t.id==="rte"){captureBody();return}
  if(t.dataset&&t.dataset.an==="note"&&V.sel){(V.forms["an:"+V.sel.id]=V.forms["an:"+V.sel.id]||{}).note=t.value;return}
  if(t.dataset&&t.dataset.rn){V.forms["rn:"+t.dataset.rn]=t.value;return}
  if(t.dataset&&t.dataset.ff&&t.tagName!=="SELECT"&&t.type!=="date"){formInput(t,false);return}
  if(t.dataset&&t.dataset.sf&&V.sel){var c=V.content[V.sel.id],k=t.dataset.sf.split(":");c.steps[+k[0]][k[1]]=t.value;c.dirty=true;return}
  if(t.dataset&&t.dataset.tf&&V.sel){var c5=V.content[V.sel.id];c5.fields[t.dataset.tf]=t.value;c5.dirty=true;return}
  if(t.id==="q"){V.q=t.value.trim();if(V.view==="overview"&&V.q)V.view="all";V.limit=200;renderChips();renderRail();renderMain();return}
  if(t.id==="bvalue"){V.bulk.value=t.value;keepFocus("bvalue",renderPanel);return}
  if(t.id==="d-note"&&V.sel){V.forms["d:"+V.sel.id]=t.value;return}
  if((t.id==="p-q"||t.id==="p-ans")&&V.sel){var f=V.forms["p:"+V.sel.id]=V.forms["p:"+V.sel.id]||{};f[t.id==="p-q"?"q":"ans"]=t.value;return}
  if(t.id&&t.id.indexOf("e-")===0&&V.sel){var g=V.forms[V.sel.id]=V.forms[V.sel.id]||{};g[t.id.slice(2)]=t.value;return}
});
document.addEventListener("change",function(e){
  var t=e.target;if(!D)return;
  if(t.dataset&&t.dataset.ff){formInput(t,t.tagName==="SELECT"||t.type==="date");return}
  if(t.id==="bdue"){V.bulk.due=t.value;return}
  if(t.id==="bfield"){V.bulk.field=t.value;V.bulk.value="";V.bulk.vals={};render();return}
  if(t.id==="bvalue"){V.bulk.value=t.value;renderPanel();return}
  if(t.id==="p-aud"&&V.sel){var f=V.forms["p:"+V.sel.id]=V.forms["p:"+V.sel.id]||{};f.aud=t.value;return}
  if(t.id==="pg-cat"&&V.sel){V.forms["pg:"+V.sel.id]=t.value;renderPanel();return}
  if(t.name==="e-applies"&&V.sel){var g=V.forms[V.sel.id]=V.forms[V.sel.id]||{};g.appliesTo=checkedVals("e-applies");return}
  if(t.id&&t.id.indexOf("e-")===0&&V.sel){var h=V.forms[V.sel.id]=V.forms[V.sel.id]||{};h[t.id.slice(2)]=t.value;return}
});
function keepFocus(id,fn){var el=$(id),pos=el&&el.selectionStart;fn();var n=$(id);if(n){n.focus();try{if(pos!=null)n.setSelectionRange(pos,pos)}catch(err){}}}
function captureBody(){var el=$("rte");if(el&&V.sel&&V.content[V.sel.id]){V.content[V.sel.id].body=el.innerHTML;V.content[V.sel.id].dirty=true}}
function captureAll(c){if(!c||!V.sel)return;var el=$("rte");if(el&&c===V.content[V.sel.id]&&el.getAttribute("contenteditable")==="true")c.body=el.innerHTML}
function saveRange(){var s=window.getSelection(),el=$("rte");if(s&&s.rangeCount&&el&&el.contains(s.anchorNode))V.range=s.getRangeAt(0).cloneRange()}
function restoreRange(){var el=$("rte");if(!el)return;el.focus();if(V.range){var s=window.getSelection();s.removeAllRanges();try{s.addRange(V.range)}catch(err){}}}
function doFmt(k){
  var el=$("rte");if(!el)return;
  if(k==="link"){saveRange();if(!V.range||V.range.collapsed){toast("Select the words to link first.",true);return}captureBody();V.linkFor=V.sel.id;renderPanel();var u=$("linkurl");if(u)u.focus();return}
  el.focus();if(V.range){var s=window.getSelection();if(!s.rangeCount||!el.contains(s.anchorNode)){s.removeAllRanges();s.addRange(V.range)}}
  if(k==="bold")document.execCommand("bold");else if(k==="italic")document.execCommand("italic");else if(k==="h3")document.execCommand("formatBlock",false,"h3");else if(k==="ul")document.execCommand("insertUnorderedList");else if(k==="ol")document.execCommand("insertOrderedList");else if(k==="unlink")document.execCommand("unlink");
  captureBody();
}
document.addEventListener("selectionchange",function(){saveRange()});
function doSaveContent(){
  var a=D.by[V.sel.id],c=V.content[a.id];captureAll(c);
  var steps=c.steps.map(function(s,i){return {id:s.id,sequence:i+1,instruction:(s.instruction||"").trim(),verifyLine:(s.verifyLine||"").trim(),isOptional:!!s.isOptional,performedByRole:s.performedByRole}});
  if(steps.some(function(s){return !s.instruction})){toast("Every step needs a 'Do this' line, or remove the empty step.",true);return}
  var text=String(c.body||"").replace(/<[^>]*>/g,"").trim();if(!text&&!steps.length){toast("The article has no content yet.",true);return}
  act("saveContent",{articleId:a.id,editVersion:c.editVersion||a.editVersion,body:c.body,steps:steps,fields:c.fields},"content:"+a.id).then(function(r){if(r.ok){V.done["content:"+a.id]=true;delete V.content[a.id];render()}});
}
var drag=null;
document.addEventListener("pointerdown",function(e){if(!e.target||e.target.id!=="grip")return;drag={x:e.clientX,w:$("panel").getBoundingClientRect().width};e.preventDefault()});
document.addEventListener("pointermove",function(e){if(!drag)return;var max=window.innerWidth-216-320;V.pw=Math.max(420,Math.min(max,Math.round(drag.w+(drag.x-e.clientX))));$("panel").style.width=V.pw+"px"});
document.addEventListener("pointerup",function(){if(drag){drag=null;renderMain()}});
document.addEventListener("keydown",function(e){if(!e.target||e.target.id!=="grip")return;if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;e.preventDefault();var w=V.pw||defaultPw(),max=window.innerWidth-216-320;V.pw=Math.max(420,Math.min(max,w+(e.key==="ArrowLeft"?40:-40)));applyPw();$("grip").setAttribute("aria-valuenow",V.pw)});
function doFix(issueId){
  var a=D.by[V.sel.id],x=a.issues.filter(function(i){return i.id===issueId})[0];if(!x)return;
  var p={articleId:a.id,issueId:x.id,kind:x.kind,editVersion:a.editVersion},el=document.querySelector('[data-fv="'+issueId+'"]');
  if(x.kind==="sync_rejected"){var fd=issueField(x);p.field=fd.k;p.value=fd.kind==="multi"?checkedVals("fv-"+issueId):(el?el.value:"");
    if(fd.kind==="number"&&!/^\d+$/.test(String(p.value))){toast("Enter a whole number of minutes.",true);return}
    if((fd.kind!=="multi"&&!p.value)||(fd.kind==="multi"&&!p.value.length)){toast("Choose a value first.",true);return}
    if(fd.kind==="number")p.value=Number(p.value)}
  else if(x.kind==="not_linked"){p.sfNumber=(el&&el.value||"").trim();if(!/^\d{6,10}$/.test(p.sfNumber)){toast("Enter the Salesforce article number, digits only.",true);return}}
  else if(x.kind==="needs_category"){p.category=el&&el.value;if(!p.category){toast("Choose a data category.",true);return}}
  else if(x.kind==="applies_to_blank"){p.appliesTo=checkedVals("fv-"+issueId);if(!p.appliesTo.length){toast("Tick at least one Applies To value.",true);return}}
  if(needsReturn(a,x)){var note=String(V.forms["rn:"+issueId]||"").trim();if(note.length<10){toast("Say why you're returning it, in 10 characters or more.",true);return}
    if(note.length>10000){toast("Keep the reason under 10,000 characters.",true);return}
    p.note=note;act("returnAndFixIssue",p,"fix:"+issueId).then(function(r){if(r.ok){delete V.forms["rn:"+issueId];toast(r.message||"Correction saved. Send the article for business review again.")}});return}
  act("fixIssue",p,"fix:"+issueId).then(function(r){if(r.ok)toast(r.message||"Saved.")});
}
function doSave(){
  var a=D.by[V.sel.id],f=V.forms[a.id]||{},fields={};
  ["title","summary","type","audience","department","difficulty","reviewCycle","category"].forEach(function(k){if(f[k]!==undefined&&f[k]!==(a[k]==null?"":a[k]))fields[k]=f[k]===""?null:f[k]});
  if(f.estimatedMinutes!==undefined&&String(f.estimatedMinutes)!==String(a.estimatedMinutes==null?"":a.estimatedMinutes)){if(f.estimatedMinutes!==""&&!/^\d+$/.test(f.estimatedMinutes)){toast("Estimated time must be a whole number of minutes.",true);return}fields.estimatedMinutes=f.estimatedMinutes===""?null:Number(f.estimatedMinutes)}
  if(f.appliesTo&&show(f.appliesTo)!==show(a.appliesTo))fields.appliesTo=f.appliesTo;
  if(fields.title!==undefined&&!String(fields.title||"").trim()){toast("The title can't be blank.",true);return}
  if(!Object.keys(fields).length){toast("Nothing has changed.");return}
  act("saveDraft",{articleId:a.id,editVersion:a.editVersion,fields:fields},"edit:"+a.id).then(function(r){if(r.ok){delete V.forms[a.id];V.done["edit:"+a.id]=true;render()}});
}
function doPenny(outcome){
  var a=D.by[V.sel.id],f=V.forms["p:"+a.id]||{},aud=($("p-aud")||{}).value||f.aud||"Learner",q=(($("p-q")||{}).value||"").trim();
  if(q.length<8){toast("Write the question you asked Penny.",true);return}
  act("recordPennyCheck",{articleId:a.id,contentVersion:a.contentVersion,audience:aud.toLowerCase(),question:q,answer:(($("p-ans")||{}).value||"").trim()||null,outcome:outcome},"penny:"+a.id).then(function(r){if(r.ok){delete V.forms["p:"+a.id];toast(outcome==="passed"?"Penny check saved. Business review and publication are checked separately.":"Recorded. Fix the article, then check again.");if(outcome==="failed"){V.tab="fix";render()}}});
}
function doBulk(){
  var ids=pickedIds(),pv=bulkPreview(ids);if(!pv.change.length)return;
  if(fieldDef(V.bulk.field).kind==="person"){var to=bulkTarget(null);
    act("bulkAssign",{items:pv.change.map(function(c){return {id:c.a.id,expectedRevision:(c.a.assignment&&c.a.assignment.revision)||null}}),kind:V.bulk.field==="reviewer"?"business":"technical",assignee:to||null,dueDate:V.bulk.due||null},"bulk").then(function(r){if(r.ok){var n=r.data&&r.data.saved!=null?r.data.saved:pv.change.length,failed=r.data&&r.data.failed||0;V.done.bulk="Assigned "+n+" article"+(n===1?"":"s")+"."+(failed?" "+failed+" couldn't be assigned; they stay selected.":"");var keep={};(r.data&&r.data.failedIds||[]).forEach(function(id){keep[id]=true});V.picked=keep;render()}});
    return}
  var b=V.bulk,fd=fieldDef(b.field),p={articleIds:pv.change.map(function(c){return c.a.id}),versions:{},field:b.field,onlyBlank:b.onlyBlank,skipReview:!!(b.skip&&D.viewer.canSkipReview)};
  pv.change.forEach(function(c){p.versions[c.a.id]=c.a.editVersion});
  if(fd.kind==="multi"){p.mode=b.mode;p.values=Object.keys(b.vals).filter(function(k){return b.vals[k]})}else p.value=fd.kind==="number"?Number(b.value):b.value;
  act("bulkUpdate",p,"bulk").then(function(r){if(r.ok){var n=r.data&&r.data.saved!=null?r.data.saved:p.articleIds.length,failed=r.data&&r.data.failed||0;V.done.bulk=(p.skipReview?"Sent "+n+" revision"+(n===1?"":"s")+" to Publish.":"Saved "+n+" draft revision"+(n===1?"":"s")+" for business review.")+(failed?" "+failed+" couldn't be saved; they stay selected.":"");
    var keep={};(r.data&&r.data.failedIds||[]).forEach(function(id){keep[id]=true});V.picked=keep;render()}});
}
function doDecide(id){
  var d=D.decisions.filter(function(x){return x.id===id})[0],note=(($("d-note")||{}).value||"").trim();
  if(d.kind!=="Policy"&&note.length<3){toast("Write the answer first.",true);return}
  act(d.kind==="Policy"?"signPolicy":"answerDecision",{decisionId:id,articleId:d.articleId||null,ruleStatement:d.rule||null,note:note||null},"dec:"+id).then(function(r){if(r.ok){delete V.forms["d:"+id];toast(d.kind==="Policy"?"Policy signature saved for this article version.":"Answer saved.")}});
}
})();
</script>
