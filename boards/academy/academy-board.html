<style>
/* A dashboard first: one screen of metric tiles. Tap a tile to see the records behind it, tap a record to act in Trail OS.
   Same tokens and fonts as Penny's Brain Map and the Trail Crew Boards. */
:root{
  --ground:#F2F5F1; --surface:#FFFFFF; --sunk:#E8EDE8; --ink:#16201B; --muted:#56635C; --line:#D5DDD6;
  --pine:#1B6A50; --pine-ink:#FFFFFF; --focus:#1B6A50; --sky:#2B78A0;
  --bad:#C0452A; --warn:#B9800F; --good:#1C7A4B; --none:#86918B;
  --bad-bg:#F8E7E2; --warn-bg:#F6EDD8; --good-bg:#E0F1E7; --sky-bg:#E1EEF5;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 8px 24px rgba(20,40,30,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1512; --surface:#17201B; --sunk:#1D2722; --ink:#E6ECE8; --muted:#9BA8A1; --line:#2B3731;
  --pine:#5DC39B; --pine-ink:#0F1512; --focus:#5DC39B; --sky:#6CB4D8;
  --bad:#EC7A60; --warn:#E3B04A; --good:#5ECB90; --none:#8E9A94;
  --bad-bg:#3A221C; --warn-bg:#3A2F17; --good-bg:#173323; --sky-bg:#17303D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0F1512; --surface:#17201B; --sunk:#1D2722; --ink:#E6ECE8; --muted:#9BA8A1; --line:#2B3731;
  --pine:#5DC39B; --pine-ink:#0F1512; --focus:#5DC39B; --sky:#6CB4D8;
  --bad:#EC7A60; --warn:#E3B04A; --good:#5ECB90; --none:#8E9A94;
  --bad-bg:#3A221C; --warn-bg:#3A2F17; --good-bg:#173323; --sky-bg:#17303D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:800}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px;color:var(--muted)}
.mode{display:inline-flex;align-items:center;gap:8px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--ink)}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--none)} .mode.live i{background:var(--good)}

/* scope bar */
.scope{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.scope .lbl{font-size:13px;color:var(--muted);font-weight:700;margin-right:6px}

/* hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 32px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;box-shadow:var(--shadow)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6vw,56px);line-height:1;letter-spacing:-.03em}
.big small{font-size:.36em;color:var(--muted);font-weight:600;letter-spacing:0}
.courses{display:flex;flex-direction:column;gap:10px;min-width:0}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.crow .t{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .p{font-family:var(--f-mono);font-size:14px}
.crow .bar{grid-column:1/-1}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%}

/* metric tiles */
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-size:16px;font-family:var(--f-body);font-weight:700;color:var(--muted);letter-spacing:.02em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;min-width:0;position:relative}
.tile:hover{border-color:var(--pine);box-shadow:var(--shadow)}
.tile .l{font-size:14px;font-weight:700;line-height:1.3}
.tile .v{display:flex;align-items:baseline;gap:8px}
.tile .n{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.tile .of{font-size:13px;color:var(--muted)}
.tile.bad .n{color:var(--bad)} .tile.sky .n{color:var(--sky)} .tile.warn .n{color:var(--warn)} .tile.good .n{color:var(--good)}
.tile .bar{height:6px}
.tile .go{font-size:12.5px;font-weight:700;color:var(--pine);margin-top:2px}
.tile .who{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* drill */
.drill{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.back{align-self:flex-start;border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:700}
.dh{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.dh .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.explain{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.explain div{background:var(--ground);border-radius:10px;padding:10px 14px;font-size:14px}
.explain b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.fchip b{font-family:var(--f-mono);font-weight:500;margin-left:4px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
th{border-top:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);white-space:nowrap}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--ground)}
.sub{display:block;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap;margin:1px 2px 1px 0}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.sky{background:var(--sky-bg);color:var(--sky)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:13.5px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.empty{padding:16px;color:var(--muted);font-size:14px}

/* week drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .hd{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.drawer .bd{overflow-y:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px}
.close{border:0;background:none;font-size:26px;line-height:1;padding:2px 6px;color:var(--muted)}
.ck{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ck li{display:flex;gap:8px;align-items:baseline}
.ck li::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--bad);transform:translateY(1px)}
.ck li.ok::before{background:var(--good);border-color:var(--good)}
.ck li.opt::before{border-color:var(--none);border-style:dashed}
.ck li.opt.ok::before{background:var(--none);border-color:var(--none);border-style:solid}
.where{display:block;font-size:12.5px;color:var(--muted)}
.flag{color:var(--bad);font-size:12px;font-weight:700;display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:960px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}.explain{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.tile .n{font-size:28px}.tile .who{position:static}
  .drawer{top:auto;max-height:90%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:env(safe-area-inset-left,0px)}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:.6}}}
</style>
